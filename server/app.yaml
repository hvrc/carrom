# ⚠️  DEPLOYMENT NOTE — read before using this file.
# The server now defaults to WebSocket-only transport (research §C2), and
# App Engine *standard* (env: standard) does NOT support WebSockets. The
# recommended target is **Cloud Run** (see server/Dockerfile and the deploy
# block in prd.md) — native WebSocket, single-instance pin, always-on CPU.
#
# If you must stay on App Engine, use env: flex (flexible) for WebSocket
# support. To keep the in-memory `rooms` Map correct you MUST stay on a single
# instance — hence max_instances: 1 below. If you instead keep env: standard,
# you must run the server with SOCKET_TRANSPORTS=polling,websocket AND enable
# session affinity (uncomment `network.session_affinity`), accepting the higher
# long-polling latency.

runtime: nodejs20
service: backend
env: standard
instance_class: F1

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 1   # single instance: in-memory room state must not be split

# network:
#   session_affinity: true   # only needed if falling back to long-polling

env_variables:
  NODE_ENV: "production"
  PORT: "8080"
  # SOCKET_TRANSPORTS: "polling,websocket"   # uncomment ONLY on env: standard

handlers:
- url: /.*
  script: auto
  secure: always
